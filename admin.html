<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة المسؤول — اشتراكات الكهرباء</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{
  --navy:#1a3a5c;--navy-dark:#112843;--navy-light:#2a5080;
  --bg:#f0f4f8;--card:#fff;
  --text:#1a2332;--text2:#5a6a7e;--text3:#8fa0b4;
  --green:#00b894;--green-bg:#e8faf6;
  --red:#e17055;--red-bg:#fef0ec;
  --amber:#f0a500;--amber-bg:#fff8e8;
  --border:#e4ecf4;--r:16px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
.wrap{max-width:760px;margin:0 auto;padding:18px;}
.hdr{background:linear-gradient(135deg,var(--navy-dark),var(--navy));color:#fff;padding:22px 18px;border-radius:var(--r);margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;}
.hdr h1{font-size:18px;font-weight:800;}
.hdr p{font-size:12px;opacity:.8;margin-top:3px;}
.btn{padding:9px 16px;border-radius:10px;border:none;background:rgba(255,255,255,.15);color:#fff;font-family:'Tajawal',sans-serif;font-weight:700;font-size:12px;cursor:pointer;}
.fc{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:12px;font-size:14px;font-family:'Tajawal',sans-serif;outline:none;background:var(--card);margin-bottom:10px;}
.fc:focus{border-color:var(--navy);}
.fl{font-size:12px;color:var(--text2);margin-bottom:5px;display:block;font-weight:700;}
.btn-main{width:100%;padding:13px;border-radius:12px;border:none;background:var(--navy);color:#fff;font-family:'Tajawal',sans-serif;font-weight:800;font-size:14px;cursor:pointer;margin-top:6px;}
.login-box{background:var(--card);border-radius:var(--r);padding:26px 22px;max-width:380px;margin:60px auto;box-shadow:0 10px 30px rgba(0,0,0,.06);}
.login-box h2{text-align:center;margin-bottom:4px;font-size:18px;color:var(--navy);}
.login-box p{text-align:center;font-size:12px;color:var(--text2);margin-bottom:18px;}
.err{background:var(--red-bg);color:var(--red);font-size:12px;padding:9px 12px;border-radius:10px;margin-bottom:10px;display:none;text-align:center;}
.err.show{display:block;}
.sec-title{font-size:14px;font-weight:800;color:var(--navy);margin:18px 0 10px;}
.card{background:var(--card);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.04);display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.av{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--navy),var(--navy-light));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0;}
.info{flex:1;min-width:140px;}
.info .name{font-weight:800;font-size:14px;}
.info .email{font-size:12px;color:var(--text2);direction:ltr;text-align:right;}
.info .date{font-size:11px;color:var(--text3);margin-top:2px;}
.badge{font-size:11px;padding:4px 10px;border-radius:20px;font-weight:700;}
.b-pending{background:var(--amber-bg);color:var(--amber);}
.b-approved{background:var(--green-bg);color:var(--green);}
.b-rejected{background:var(--red-bg);color:var(--red);}
.actions{display:flex;gap:6px;width:100%;}
.actions button{flex:1;padding:9px;border-radius:10px;border:none;font-family:'Tajawal',sans-serif;font-weight:700;font-size:12px;cursor:pointer;}
.act-approve{background:var(--green);color:#fff;}
.act-reject{background:var(--red);color:#fff;}
.act-revoke{background:var(--bg);color:var(--text2);border:1.5px solid var(--border)!important;}
.empty{text-align:center;color:var(--text3);font-size:13px;padding:30px 0;}
.loading{text-align:center;padding:40px;color:var(--text2);}
</style>
</head>
<body>

<div id="loginScreen" class="login-box">
  <h2>🔐 لوحة المسؤول</h2>
  <p>تسجيل دخول المسؤول فقط</p>
  <div class="err" id="loginErr"></div>
  <label class="fl">البريد الإلكتروني</label>
  <input type="email" class="fc" id="adminEmail" style="direction:ltr;text-align:right;">
  <label class="fl">كلمة المرور</label>
  <input type="password" class="fc" id="adminPass">
  <button class="btn-main" onclick="adminLogin()">دخول</button>
</div>

<div id="adminPanel" class="wrap" style="display:none;">
  <div class="hdr">
    <div>
      <h1>⚡ لوحة المسؤول</h1>
      <p id="adminEmailTxt"></p>
    </div>
    <button class="btn" onclick="adminLogout()">خروج</button>
  </div>

  <div class="sec-title">⏳ طلبات قيد المراجعة</div>
  <div id="pendingList"><div class="loading">جاري التحميل...</div></div>

  <div class="sec-title">👥 جميع المستخدمين</div>
  <div id="allList"></div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAw5Cyqj_eKbbhoFQ7g8k3xGNVvFMT0nLI",
  authDomain: "electricity-app-d979a.firebaseapp.com",
  projectId: "electricity-app-d979a",
  storageBucket: "electricity-app-d979a.firebasestorage.app",
  messagingSenderId: "328128980840",
  appId: "1:328128980840:web:065b06644512b1104698dd"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// ضع هنا بريدك الإلكتروني الذي ستستخدمه كمسؤول
const ADMIN_EMAILS = ["mateetrasheed@gmail.com"];

function adminLogin(){
  const errEl=document.getElementById('loginErr');
  errEl.classList.remove('show');
  const email=document.getElementById('adminEmail').value.trim();
  const pass=document.getElementById('adminPass').value;
  if(!email||!pass){errEl.textContent='أدخل البريد وكلمة المرور';errEl.classList.add('show');return;}
  auth.signInWithEmailAndPassword(email,pass).catch(e=>{
    errEl.textContent='بيانات الدخول غير صحيحة';
    errEl.classList.add('show');
  });
}
function adminLogout(){auth.signOut();}

auth.onAuthStateChanged(user=>{
  if(user && ADMIN_EMAILS.includes(user.email)){
    document.getElementById('loginScreen').style.display='none';
    document.getElementById('adminPanel').style.display='block';
    document.getElementById('adminEmailTxt').textContent=user.email;
    loadUsers();
  } else if(user){
    auth.signOut();
    const errEl=document.getElementById('loginErr');
    errEl.textContent='هذا الحساب غير مصرّح له بالدخول للوحة المسؤول';
    errEl.classList.add('show');
  } else {
    document.getElementById('loginScreen').style.display='block';
    document.getElementById('adminPanel').style.display='none';
  }
});

function ini(name){return (name||'؟').trim().split(' ')[0].slice(0,1).toUpperCase();}
function fmtDate(ts){
  if(!ts)return '';
  const d=ts.toDate?ts.toDate():new Date(ts);
  return d.toLocaleDateString('ar-PS',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
}

function loadUsers(){
  db.collection('users').orderBy('createdAt','desc').onSnapshot(snap=>{
    const pending=[], all=[];
    snap.forEach(doc=>{
      const d={id:doc.id,...doc.data()};
      all.push(d);
      if(d.status==='pending')pending.push(d);
    });
    renderPending(pending);
    renderAll(all);
  },err=>{
    document.getElementById('pendingList').innerHTML=`<div class="empty">خطأ في التحميل: ${err.message}</div>`;
  });
}

function renderPending(list){
  const el=document.getElementById('pendingList');
  if(!list.length){el.innerHTML=`<div class="empty">لا توجد طلبات قيد المراجعة 🎉</div>`;return;}
  el.innerHTML=list.map(u=>`
    <div class="card">
      <div class="av">${ini(u.name)}</div>
      <div class="info">
        <div class="name">${u.name||'بدون اسم'}</div>
        <div class="email">${u.email||''}</div>
        <div class="date">📅 ${fmtDate(u.createdAt)}</div>
      </div>
      <span class="badge b-pending">⏳ قيد المراجعة</span>
      <div class="actions">
        <button class="act-approve" onclick="setStatus('${u.id}','approved')">✅ قبول</button>
        <button class="act-reject" onclick="setStatus('${u.id}','rejected')">🚫 رفض</button>
      </div>
    </div>
  `).join('');
}

function renderAll(list){
  const el=document.getElementById('allList');
  if(!list.length){el.innerHTML=`<div class="empty">لا يوجد مستخدمون بعد</div>`;return;}
  el.innerHTML=list.map(u=>{
    let badge='', actions='';
    if(u.status==='approved'){
      badge=`<span class="badge b-approved">✅ مفعّل</span>`;
      actions=`<div class="actions"><button class="act-revoke" onclick="setStatus('${u.id}','rejected')">🚫 إيقاف الحساب</button></div>`;
    } else if(u.status==='rejected'){
      badge=`<span class="badge b-rejected">🚫 مرفوض</span>`;
      actions=`<div class="actions"><button class="act-approve" onclick="setStatus('${u.id}','approved')">✅ قبول</button></div>`;
    } else {
      badge=`<span class="badge b-pending">⏳ قيد المراجعة</span>`;
    }
    return `<div class="card">
      <div class="av">${ini(u.name)}</div>
      <div class="info">
        <div class="name">${u.name||'بدون اسم'}</div>
        <div class="email">${u.email||''}</div>
        <div class="date">📅 ${fmtDate(u.createdAt)}</div>
      </div>
      ${badge}
      ${actions}
    </div>`;
  }).join('');
}

function setStatus(uid,status){
  db.collection('users').doc(uid).update({status:status});
}
</script>
</body>
</html>
